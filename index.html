<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>YouCine Tizen Lab</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b0d11;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}*{box-sizing:border-box}body{display:flex;align-items:center;justify-content:center}.wrap{width:92%;height:88%;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid #2b3038}.brand{font-size:38px;font-weight:800}.tag{font-size:18px;opacity:.6}.main{flex:1;display:flex;gap:28px;padding-top:28px}.menu{width:260px;display:flex;flex-direction:column;gap:14px}.menu button,.card{border:2px solid transparent;border-radius:12px;background:#171b23;color:#fff;padding:18px;font-size:23px;text-align:left}.menu button.sel,.focused{border-color:#fff!important;background:#242a34}.content{flex:1}.content h1{font-size:46px;margin:0 0 8px}.content p{font-size:21px;opacity:.68;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{height:130px}.status{margin-top:24px;padding:14px 16px;border:1px solid #2b3038;border-radius:10px;font-size:17px;opacity:.75}.pass{font-weight:700}.footer{padding-top:18px;font-size:16px;opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">YC • TIZEN</div><div class="tag">FASE 2.1 · SINGLE FILE</div></div>
  <div class="main">
    <div class="menu" id="menu">
      <button data-view="Home" class="sel">Home</button>
      <button data-view="Filmes">Filmes</button>
      <button data-view="Séries">Séries</button>
      <button data-view="Pesquisa">Pesquisa</button>
      <button data-view="Perfil">Perfil</button>
    </div>
    <div class="content">
      <h1 id="title">Home</h1>
      <p>Frontend local carregado pelo TizenBrew. Backend ainda não conectado.</p>
      <div class="grid" id="grid">
        <button class="card">Bloco 1</button><button class="card">Bloco 2</button><button class="card">Bloco 3</button><button class="card">Bloco 4</button>
        <button class="card">Bloco 5</button><button class="card">Bloco 6</button><button class="card">Bloco 7</button><button class="card">Bloco 8</button>
      </div>
      <div class="status">TizenBrew: <span class="pass">PASS</span> · Controle: <span id="ctl">aguardando</span> · Última tecla: <span id="key">—</span></div>
    </div>
  </div>
  <div class="footer">↑ ↓ ← → navegar · OK selecionar</div>
</div>
<script>
(function(){
  var menu=[].slice.call(document.querySelectorAll('#menu button'));
  var cards=[].slice.call(document.querySelectorAll('.card'));
  var focus=menu[0];
  function setF(el){[].slice.call(document.querySelectorAll('button')).forEach(function(x){x.classList.remove('focused')});focus=el;if(el){el.classList.add('focused');try{el.focus()}catch(e){}}}
  function selectMenu(el){menu.forEach(function(x){x.classList.remove('sel')});el.classList.add('sel');document.getElementById('title').textContent=el.getAttribute('data-view')}
  setF(menu[0]);
  document.addEventListener('keydown',function(e){
    document.getElementById('ctl').textContent='PASS';document.getElementById('key').textContent=e.keyCode;
    var mi=menu.indexOf(focus),ci=cards.indexOf(focus),cols=4;
    if(e.keyCode===13&&mi>=0){selectMenu(focus);return}
    if(mi>=0){if(e.keyCode===38&&mi>0)setF(menu[mi-1]);else if(e.keyCode===40&&mi<menu.length-1)setF(menu[mi+1]);else if(e.keyCode===39)setF(cards[0]);return}
    if(ci>=0){if(e.keyCode===37){if(ci%cols===0)setF(document.querySelector('#menu .sel'));else setF(cards[ci-1])}else if(e.keyCode===39&&ci+1<cards.length&&(ci+1)%cols!==0)setF(cards[ci+1]);else if(e.keyCode===38&&ci-cols>=0)setF(cards[ci-cols]);else if(e.keyCode===40&&ci+cols<cards.length)setF(cards[ci+cols])}
  });
})();
</script>
</body>
</html>
